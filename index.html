<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E7 Group - Packing & Distribution Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB09o7c511T_E5OXVCTPxQenkeEJHjAkw",
            authDomain: "e7-group---packing-dashboard.firebaseapp.com",
            projectId: "e7-group---packing-dashboard",
            storageBucket: "e7-group---packing-dashboard.appspot.com",
            messagingSenderId: "568097200607",
            appId: "1:568097200607:web:e2018a35f8934abaaa4c0a",
            measurementId: "G-XBEGSTY7SN",
            databaseURL: "https://e7-group---packing-dashboard-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.updateCloudData = function() {
            const morningVal = document.getElementById('morning-input').value || 0;
            const eveningVal = document.getElementById('evening-input').value || 0;
            set(ref(db, 'dashboard/shifts'), {
                morning: morningVal,
                evening: eveningVal
            });
        };

        onValue(ref(db, 'dashboard/shifts'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(document.getElementById('morning-input')) document.getElementById('morning-input').value = data.morning;
                if(document.getElementById('evening-input')) document.getElementById('evening-input').value = data.evening;
                if(document.getElementById('cloud-status')) {
                    document.getElementById('cloud-status').innerText = "Cloud Live";
                    document.getElementById('cloud-status').className = "px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold flex items-center gap-1";
                }
            }
        });
    </script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 font-sans">
    <div class="max-w-xl mx-auto space-y-4">
        
        <!-- Header -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <div>
                <h1 class="text-lg font-bold text-blue-400">E7 Group - Packing & Distribution Dashboard</h1>
                <p class="text-xs text-slate-400">Warehouse Operations & Logistics Real-time Control System</p>
            </div>
            <div class="text-left">
                <span id="cloud-status" class="px-3 py-1 bg-amber-600 text-white rounded-lg text-xs font-bold">Connecting...</span>
                <span class="block text-[10px] text-slate-400 mt-1">Term 2 (2026/2027)</span>
            </div>
        </div>

        <!-- Shift Inputs & Targets -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-4 shadow-lg">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Morning Shift Output</label>
                    <input type="number" id="morning-input" oninput="updateCloudData()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="0">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Evening Shift Output</label>
                    <input type="number" id="evening-input" oninput="updateCloudData()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="0">
                </div>
            </div>
        </div>

        <!-- Total Targeted Students -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-slate-400 font-semibold tracking-wider">TOTAL TARGETED STUDENTS</span>
                <span class="text-xs text-blue-400 font-bold">100%</span>
            </div>
            <div class="text-3xl font-black text-white mb-2">247,592</div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div class="bg-blue-500 h-full w-full"></div>
            </div>
            <span class="block text-[10px] text-slate-400 mt-1">Students (Term 2 Total)</span>
        </div>

        <!-- Packed to Date -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-slate-400 font-semibold tracking-wider">PACKED TO DATE</span>
                <span class="text-xs text-emerald-400 font-bold">1.33%</span>
            </div>
            <div class="text-3xl font-black text-emerald-400 mb-2">3,302</div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-2">
                <div class="bg-emerald-500 h-full" style="width: 1.33%;"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400">
                <span>Total Output Completed</span>
                <span>Live Sync Active</span>
            </div>
        </div>

    </div>
</body>
</html>
