<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E7 Group - Packing & Distribution Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyB09o7c511T_E5OXVCTPxQenkeEJHjAkw",
            authDomain: "e7-group---packing-dashboard.firebaseapp.com",
            projectId: "e7-group---packing-dashboard",
            storageBucket: "e7-group---packing-dashboard.appspot.com",
            messagingSenderId: "568097200607",
            appId: "1:568097200607:web:e2018a35f8934abaaa4c0a",
            measurementId: "G-XBEGSTY7SN",
            databaseURL: "https://e7-group---packing-dashboard-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ربط الحقول والتحديث الحي المباشر
        window.saveDataToCloud = function(shiftData) {
            set(ref(db, 'dashboard/currentData'), shiftData);
        };

        onValue(ref(db, 'dashboard/currentData'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // تحديث واجهة المستخدم بالبيانات الواردة من السحابة
                document.getElementById('status-badge').className = "px-3 py-1 bg-emerald-600 text-white rounded-full text-sm font-semibold flex items-center gap-2";
                document.getElementById('status-badge').innerHTML = "🟢 Online Mode (Live)";
                if(document.getElementById('morning-input')) {
                    document.getElementById('morning-input').value = data.morning || 0;
                }
                if(document.getElementById('evening-input')) {
                    document.getElementById('evening-input').value = data.evening || 0;
                }
            }
        });
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl shadow">
            <h1 class="text-xl font-bold">E7 Group Packing Dashboard</h1>
            <div id="status-badge" class="px-3 py-1 bg-amber-600 text-white rounded-full text-sm font-semibold flex items-center gap-2">
                🟡 Connecting...
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-xl shadow grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium mb-2">Morning Shift Quantity</label>
                <input type="number" id="morning-input" onchange="saveDataToCloud({morning: this.value, evening: document.getElementById('evening-input').value})" class="w-full bg-slate-700 border border-slate-600 rounded p-3 text-white" placeholder="أدخل كمية الشفت الصباحي">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Evening Shift Quantity</label>
                <input type="number" id="evening-input" onchange="saveDataToCloud({morning: document.getElementById('morning-input').value, evening: this.value})" class="w-full bg-slate-700 border border-slate-600 rounded p-3 text-white" placeholder="أدخل كمية الشفت المسائي">
            </div>
        </div>
    </div>
</body>
</html>
